[project]
name = "issue2pr"
version = "0.1.0"
description = "Offline-first GitHub issue-to-PR autonomous agent with budget, safety, and verification gates"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Pedro Monteiro" }]
dependencies = [
  "coverage==7.17.5",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "mypy==2.4.1",
]

[project.scripts]
issue2pr = "issue2pr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["issue2pr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.14"
strict = true
